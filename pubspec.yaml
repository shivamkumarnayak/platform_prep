name: prepmock
description: RRB JE CBT-1 mock tests built from the official answer key (Feb 2026 shifts).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/data/rrb_je/
    - assets/data/ssc_je/
    - assets/data/stet_bihar/
    - assets/images/t1/
    - assets/images/t2/
    - assets/images/t3/
    - assets/images/t4/
    - assets/images/t5/
    - assets/images/t6/
    - assets/images/t7/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true


flutter_native_splash:
   color: '#ffffff'
   image: assets/images/splash.png
   android: true
   ios: true
   fullscreen: true
   android_12:
      image: assets/images/splash.png
      color: '#ffffff'